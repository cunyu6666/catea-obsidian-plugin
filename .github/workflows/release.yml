name: Release

# Obsidian's updater matches a GitHub Release whose tag equals the version in
# manifest.json, exactly, with no `v` prefix, and with main.js, manifest.json and
# styles.css attached. A tag alone, or a release missing one of those assets,
# never reaches users.
#
# This workflow is manual on purpose: a release is a publishing decision, not a
# side effect of a push. The design system is vendored under
# packages/design-system, so the runner can build from this repository alone.
# scripts/release.mjs remains the local path to the same result.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, matching manifest.json exactly (no v prefix)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: The requested version must match manifest.json
        run: |
          set -eu
          manifest=$(node -p "require('./manifest.json').version")
          requested="${{ inputs.version }}"
          if [ "$manifest" != "$requested" ]; then
            echo "::error::manifest.json says $manifest but the requested version is $requested"
            exit 1
          fi

      - name: Install
        run: npm ci

      # Bundle inspection tests require a build in a clean checkout.
      - name: Build
        run: npm run build

      - name: Contracts, governance and typecheck
        run: |
          npm test
          npm run format:check
          npm run typecheck
          npm run lint
          npm run check:marketplace
          npm run test:behavior

      - name: Assert the three release assets exist
        run: |
          set -eu
          for asset in main.js manifest.json styles.css; do
            test -f "dist/catea-paper/$asset" || { echo "::error::missing release asset: $asset"; exit 1; }
          done

      # Provenance lets a user cryptographically verify that the main.js and
      # styles.css they downloaded were built by this workflow run, which is what
      # Obsidian's release review recommends. Only the two built artifacts are
      # attested; manifest.json is copied from the repository unchanged.
      - name: Attest the built release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/catea-paper/main.js
            dist/catea-paper/styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${{ inputs.version }}"
          gh release create "$version" \
            dist/catea-paper/main.js \
            dist/catea-paper/manifest.json \
            dist/catea-paper/styles.css \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --generate-notes
