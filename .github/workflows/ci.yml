name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contracts, governance and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # npm ci works standalone here: catea-components and catea-tokens are
      # published to npm. Only `npm run build` needs the sibling design-system
      # workspace, which is why the build lives in its own job below.
      - name: Install
        run: npm ci

      # 183 dependency-free assertions: per-file P3 contracts, repo-wide
      # documentation/code isomorphism, and version consistency across
      # manifest.json, package.json, versions.json and the runtime constant.
      - name: Contract and governance gate
        run: npm test

      # Fails only on diagnostics in code this repository owns. The vendored
      # CatUI snapshot and the external design-system sources are reported as
      # counts instead, because they cannot be fixed from here.
      - name: Typecheck owned code
        run: npm run typecheck

  build:
    name: Build the plugin
    runs-on: ubuntu-latest
    # The design system is a separate workspace that is not a git repository, so
    # it cannot be obtained from this repository. Set the repository variable
    # DESIGN_SYSTEM_REPO (for example cunyu6666/catea-design-system) once it has
    # a remote; this job is skipped until then. Releases cut in the meantime use
    # scripts/release.mjs on a machine where the sibling exists.
    if: ${{ vars.DESIGN_SYSTEM_REPO != '' }}
    steps:
      # Both repositories are checked out as siblings so that scripts/build.mjs
      # resolves its `../catea-design-system` reference correctly.
      - uses: actions/checkout@v4
        with:
          path: catea

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DESIGN_SYSTEM_REPO }}
          path: catea-design-system

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: catea/package-lock.json

      - name: Install the design system
        working-directory: catea-design-system
        run: npm ci

      - name: Install this plugin
        working-directory: catea
        run: npm ci

      - name: Build
        working-directory: catea
        run: npm run build

      # Obsidian needs exactly these three as release assets; a build that omits
      # one cannot be detected after publishing.
      - name: Assert the release assets exist
        working-directory: catea
        run: |
          set -eu
          for asset in main.js manifest.json styles.css; do
            test -f "dist/catea-paper/$asset" || { echo "missing release asset: $asset"; exit 1; }
          done
          echo "release assets present"

      - name: Assert the built version matches the repository version
        working-directory: catea
        run: |
          set -eu
          repo_version=$(node -p "require('./manifest.json').version")
          built_version=$(node -p "require('./dist/catea-paper/manifest.json').version")
          test "$repo_version" = "$built_version" || { echo "built $built_version but repository says $repo_version"; exit 1; }
          echo "version $repo_version"

      - uses: actions/upload-artifact@v4
        with:
          name: catea-paper-${{ github.sha }}
          path: catea/dist/catea-paper/
          if-no-files-found: error