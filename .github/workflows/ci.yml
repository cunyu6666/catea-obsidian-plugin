name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contracts, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The design system is vendored under packages/design-system, so a clean
      # checkout of this repository alone can install and build. That is what
      # Obsidian's release build verification does, and it used to fail here.
      - name: Install
        run: npm ci

      # Per-file P3 contracts, upstream provenance, repo-wide
      # documentation/code isomorphism, and version consistency across
      # manifest.json, package.json, versions.json and the runtime constant.
      - name: Contract and governance gate
        run: npm test

      # Fails only on diagnostics in code this repository owns. The vendored
      # CatUI snapshot is reported as a count instead; upstream provenance and
      # the build-time loop patch are checked by the contract and build gates.
      - name: Typecheck owned code
        run: npm run typecheck

      - name: Official plugin lint and adapter regressions
        run: |
          npm run lint
          npm run test:behavior

      - name: Build
        run: npm run build

      # Obsidian needs exactly these three as release assets; a build that omits
      # one cannot be detected after publishing.
      - name: Assert the release assets exist
        run: |
          set -eu
          for asset in main.js manifest.json styles.css; do
            test -f "dist/catea-paper/$asset" || { echo "::error::missing release asset: $asset"; exit 1; }
          done
          echo "release assets present"

      # The 5 MB limit is what Obsidian Sync Standard can carry. It is a product
      # constraint, not a style preference, so it fails the build rather than
      # waiting for the marketplace review to mention it.
      - name: Assert main.js fits the Obsidian Sync limit
        run: |
          set -eu
          bytes=$(wc -c < dist/catea-paper/main.js)
          echo "main.js is $bytes bytes"
          test "$bytes" -lt 5000000 || { echo "::error::main.js is over the 5 MB Obsidian Sync threshold"; exit 1; }

      - name: Assert the built version matches the repository version
        run: |
          set -eu
          repo_version=$(node -p "require('./manifest.json').version")
          built_version=$(node -p "require('./dist/catea-paper/manifest.json').version")
          test "$repo_version" = "$built_version" || { echo "::error::built $built_version but repository says $repo_version"; exit 1; }
          echo "version $repo_version"

      - uses: actions/upload-artifact@v4
        with:
          name: catea-paper-${{ github.sha }}
          path: dist/catea-paper/
          if-no-files-found: error
